run_id: phase2_swe_grep_average_controllability_a_behavioral_v3_qwen_tooluse_float32
summary_stage: phase2_verifier_scaleup
env_id: prime/swe-grep
model_id: Qwen/Qwen3-8B
formulation: average_controllability_a

stage1_locked_config: configs/controllability/preregistration/headline_locked_stage1_v2_prime_swe_grep.yaml
stage2_baselines: configs/controllability/preregistration/baselines_locked_stage1_v2_prime_swe_grep_average_controllability_a.yaml
stage3_aggregated_path: runs/stage3_v2_Qwen_Qwen3_8B_prime_swe_grep/aggregated_per_coordinate.json
trajectories_path: runs/rollouts/prime_swe_grep_Qwen_Qwen3_8B/trajectories.jsonl
phase2_reference: runs/phase2_swe_grep_parametric_b_behavioral_v3_qwen_tooluse_float32_merged/summary.json
inference_rationale: Phase 2 verifier-scale comparator using the same Qwen3 no-thinking tool-call settings and behavioral_encoder_v3 as the validated parametric_b swe-grep run.

patch_layer: 4
readout_layer: 6
selected_k: 8
coordinates: [0, 1, 2, 3, 4, 5, 6, 7]
controllers: [closed_loop]
signs: ["+", "-"]
required_coordinates: [0, 1, 2, 3, 4, 5, 6, 7]
required_controllers: [closed_loop]
required_signs: ["+", "-"]
require_complete_steering_grid: true
run_completeness_gate_self_test: false
seeds: [0, 1, 2]
n_prompts: 200

encoder_name: behavioral_encoder_v3
encoder_config:
  swe_query_features: 32
  swe_first_tools: 8
encoder_variance_threshold: 1.0e-8
encoder_active_fraction_floor: 0.5

eta_multiplier: 1.0
linearization_probe_norm: 1.0e-3
linearization_diagnostic_scope: turn
linearization_diagnostic_max_jobs: 64
max_completion_tokens: 512
require_tool_calls: true
agent_length_token_floor: 128
closed_loop_chunk_tokens: 32
closed_loop_budget_mode: l2_per_turn

enable_thinking: false
temperature: 0.7
top_p: 0.8
top_k: 20
min_p: 0.0
repetition_penalty: 1.05
max_prefix_tokens: 8192
max_rollout_retries: 1
empty_cache_between_jobs: true
generate_use_cache: true

dtype: float32
device_map: auto
chart_dim: 32
residual_metric: cov_h
basis_sample_trajectories: 32
basis_jacobian_states: 12
basis_train_steps: 200
basis_batch_size: 2
positions_per_sequence: 8
hidden_dim: 64
learning_rate: 0.001
ortho_weight: 10.0
metric_ridge: 0.0001
seed: 42
